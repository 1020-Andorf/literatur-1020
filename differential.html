<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2035"><title>Differentialdiagnostik – Wissensportal</title><link rel="stylesheet" href="portal.css"></head><body><header class="topbar"><div class="topinner"><div class="brand">Differentialdiagnostik<small>Wissensportal Rettungsdienst</small></div><a class="back" href="./">← Startseite</a></div></header><main class="page"><section class="hero"><h1>Leitsymptome</h1><p>Mögliche Ursachen, gezielte Fragen, Maßnahmen und Red Flags strukturiert nachschlagen.</p></section><input id="search" class="search" type="search" placeholder="Leitsymptom suchen …"><section id="grid" class="symptom-grid"></section></main><footer class="footer">Lernhilfe · keine Diagnose- oder Therapieanweisung.</footer><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));let all=[];
function box(t,a,c=''){return a?.length?`<div class="listbox ${c}"><h3>${esc(t)}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const arr=all.filter(s=>!q||JSON.stringify(s).toLowerCase().includes(q));document.getElementById('grid').innerHTML=arr.map((s,i)=>`<article class="card symptom" onclick="this.classList.toggle('open')"><div class="symptom-head"><span class="symptom-icon">${esc(s.icon||'•')}</span><div><h2>${esc(s.title)}</h2><div class="muted">${esc(s.subtitle||'')}</div></div></div><div class="details">${box('Mögliche Ursachen',s.causes)}${box('Gezielte Fragen',s.questions)}${box('Diagnostik / Maßnahmen',s.measures)}${box('Red Flags',s.redFlags,'critical')}${s.remember?`<div class="listbox remember"><h3>Merksatz</h3><p>${esc(s.remember)}</p></div>`:''}</div></article>`).join('')||'<div class="status">Keine passenden Leitsymptome gefunden.</div>'}
document.getElementById('search').addEventListener('input',render);fetch('data/differential.json').then(r=>r.json()).then(d=>{all=d.symptoms||[];render()}).catch(e=>document.getElementById('grid').innerHTML=`<div class="status">Daten konnten nicht geladen werden: ${esc(e.message)}</div>`);
</script></body></html>
