<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c2035"><title>Differentialdiagnostik – Wissensportal</title><link rel="stylesheet" href="portal.css"></head><body data-page="differential">
<header class="wp-topbar"><div class="wp-topinner"><button class="menu-btn" data-menu-button aria-label="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="wp-brand"><strong>Differentialdiagnostik</strong><small>Wissensportal Rettungsdienst</small></div><div class="wp-head-actions"><a class="header-pill" href="./">Startseite</a></div></div></header>
<main class="portal-main"><section class="page-heading"><div class="eyebrow">Leitsymptome</div><h1>Differentialdiagnostik</h1><p>Leitsymptom auswählen und mögliche Ursachen, Fragen, Maßnahmen und Red Flags im Overlay öffnen.</p></section><div class="toolbar"><label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Leitsymptom suchen …"></label><span id="count" class="result-count"></span></div><section id="grid" class="tile-grid"></section></main>
<script src="literatur/config.js"></script><script src="portal.js"></script><script>
let all=[];const esc=wpEsc;function box(t,a,c=''){return a?.length?`<section class="detail-box ${c}"><h3>${esc(t)}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
function show(id){const s=all.find(x=>x.id===id);if(!s)return;wpOpenOverlay(s.title,'Leitsymptom',`<div class="detail-grid">${box('Mögliche Ursachen',s.causes)}${box('Gezielte Fragen',s.questions)}${box('Diagnostik / Maßnahmen',s.measures)}${box('Red Flags',s.redFlags,'critical')}${s.remember?`<section class="detail-box remember"><h3>Merksatz</h3><p>${esc(s.remember)}</p></section>`:''}</div>`,s.subtitle)}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),arr=all.filter(s=>!q||JSON.stringify(s).toLowerCase().includes(q));document.getElementById('count').textContent=`${arr.length} Leitsymptom${arr.length===1?'':'e'}`;document.getElementById('grid').innerHTML=arr.map(s=>`<button class="content-tile" style="--tile-accent:#0e829b" onclick="show('${esc(s.id)}')"><div class="tile-kicker">${esc(s.icon||'•')} Leitsymptom</div><h2>${esc(s.title)}</h2><p>${esc(s.subtitle||'')}</p><span class="tile-arrow">›</span></button>`).join('')||'<p>Keine passenden Leitsymptome gefunden.</p>'}
document.getElementById('search').addEventListener('input',render);wpLoadContent('differential').then(d=>{all=d.symptoms||[];render()}).catch(e=>document.getElementById('grid').innerHTML=`<p>Daten konnten nicht geladen werden: ${esc(e.message)}</p>`);
</script></body></html>
