<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2f4f"><title>Differentialdiagnostik</title><link rel="stylesheet" href="portal.css"></head><body data-page="differential"><header class="page-topbar"><div class="page-topbar-inner"><button class="menu-btn" data-menu-button aria-label="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="page-brand"><strong>Differentialdiagnostik</strong><small>Leitsymptome schnell strukturieren</small></div><a class="header-link" href="index.html">Startseite</a></div></header><main class="main-wrap"><section class="section-panel"><div class="section-head"><div><h1>Differentialdiagnostik</h1><p>Leitsymptom auswählen und die wichtigsten Ursachen, Fragen und Red Flags im Overlay anzeigen.</p></div></div><section id="diff-grid" class="tile-grid"></section></section></main><script src="portal-content.js"></script><script src="portal.js"></script><script>const data=wpGetContent('differential');document.getElementById('diff-grid').innerHTML=data.groups.map((g,i)=>`<button class="content-tile" style="--tile-accent:${wpEsc(g.accent||'#138db0')}" onclick="showGroup(${i})"><span class="icon-chip">${wpEsc(g.icon||'⌕')}</span><h2>${wpEsc(g.title)}</h2><p>${g.items.length} häufige Differenzialdiagnosen</p></button>`).join('');function showGroup(i){const g=data.groups[i];const body=g.items.map(it=>`<section class="detail-box"><h3>${wpEsc(it.name)}</h3><div class="detail-grid"><section class="detail-box"><h4>Fragen</h4><ul>${(it.questions||[]).map(x=>`<li>${wpEsc(x)}</li>`).join('')}</ul></section><section class="detail-box critical"><h4>Red Flags</h4><ul>${(it.redFlags||[]).map(x=>`<li>${wpEsc(x)}</li>`).join('')}</ul></section></div></section>`).join('');wpOpenOverlay(g.title,'Differentialdiagnostik',body,'Leitsymptom auswählen und strukturiert abarbeiten.');}</script></body></html>
