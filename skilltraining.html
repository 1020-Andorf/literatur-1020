<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2f4f"><title>Skilltraining</title><link rel="stylesheet" href="portal.css"></head><body data-page="skilltraining"><header class="page-topbar"><div class="page-topbar-inner"><button class="menu-btn" data-menu-button aria-label="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="page-brand"><strong>Skilltraining</strong><small>Checklisten kompakt und mobil</small></div><a class="header-link" href="index.html">Startseite</a></div></header><main class="main-wrap"><section class="section-panel"><div class="section-head"><div><h1>Skilltraining</h1><p>Skills als große Kacheln. Tippen öffnet die Checkliste in einem dunklen Overlay mit klarer Struktur.</p></div></div><section id="skill-grid" class="tile-grid"></section></section></main><script src="portal-content.js"></script><script src="portal.js"></script><script>const data=wpGetContent('skilltraining');document.getElementById('skill-grid').innerHTML=data.skills.map((s,i)=>`<button class="content-tile" style="--tile-accent:${wpEsc(s.accent||'#138db0')}" onclick="showSkill(${i})"><span class="icon-chip">✓</span><h2>${wpEsc(s.name)}</h2><p>${wpEsc(s.category||'Skill')}</p></button>`).join('');function box(title,items,klass=''){return `<section class="detail-box ${klass}"><h3>${title}</h3><ul>${(items||[]).map(x=>`<li>${wpEsc(x)}</li>`).join('')}</ul></section>`;}function showSkill(i){const s=data.skills[i];wpOpenOverlay(s.name,'Skilltraining',`<div class="detail-grid">${box('Indikation',s.indication)}${box('Ablauf',s.steps)}${box('Fehlerquellen',s.pitfalls,'critical')}</div>`,s.category||'');}</script></body></html>
