<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c2035"><title>Skilltraining – Wissensportal</title><link rel="stylesheet" href="portal.css"></head><body data-page="skilltraining">
<header class="wp-topbar"><div class="wp-topinner"><button class="menu-btn" data-menu-button aria-label="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="wp-brand"><strong>Skilltraining</strong><small>Wissensportal Rettungsdienst</small></div><div class="wp-head-actions"><a class="header-pill" href="./">Startseite</a></div></div></header>
<main class="portal-main"><section class="page-heading"><div class="eyebrow">Praktische Ausbildung</div><h1>Skilltraining</h1><p>Skills als kompakte Kacheln. Tippe einen Skill an, um die hinterlegte Checkliste im Overlay zu öffnen.</p></section><div class="toolbar"><label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Skill oder Checkpunkt suchen …"></label><span id="count" class="result-count"></span></div><div id="app"></div></main>
<script src="literatur/config.js"></script><script src="portal.js"></script><script>
let groups=[];const esc=wpEsc;function key(gi,si){return `${gi}:${si}`}function show(k){const [gi,si]=k.split(':').map(Number),g=groups[gi],s=g?.skills?.[si];if(!s)return;wpOpenOverlay(s.name,g.name,`<ul class="check-list">${(s.items||[]).map(x=>`<li><span class="check-dot"></span><span>${esc(x)}</span></li>`).join('')}</ul>`)}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();let total=0,out='';groups.forEach((g,gi)=>{const skills=(g.skills||[]).map((s,si)=>({s,si})).filter(({s})=>!q||[g.name,s.name,...(s.items||[])].join(' ').toLowerCase().includes(q));if(!skills.length)return;total+=skills.length;out+=`<section class="group-panel"><h2 class="group-title">${esc(g.name)}</h2><div class="skill-grid">${skills.map(({s,si})=>`<button class="content-tile skill-tile" style="--tile-accent:#0874d1" onclick="show('${key(gi,si)}')"><h3>${esc(s.name)}</h3><span class="tile-arrow">›</span></button>`).join('')}</div></section>`});document.getElementById('count').textContent=`${total} Skill${total===1?'':'s'}`;document.getElementById('app').innerHTML=out||'<p>Keine passenden Skills gefunden.</p>'}
document.getElementById('search').addEventListener('input',render);wpLoadContent('skilltraining').then(d=>{groups=d.groups||[];render()}).catch(e=>document.getElementById('app').innerHTML=`<p>Daten konnten nicht geladen werden: ${esc(e.message)}</p>`);
</script></body></html>
