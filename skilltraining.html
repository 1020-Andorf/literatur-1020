<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2035"><title>Skilltraining – Wissensportal</title><link rel="stylesheet" href="portal.css"></head><body><header class="topbar"><div class="topinner"><div class="brand">Skilltraining<small>Wissensportal Rettungsdienst</small></div><a class="back" href="./">← Startseite</a></div></header><main class="page"><section class="hero"><h1>Skilltraining</h1><p>Fertigkeiten und Übungspunkte als übersichtliches Nachschlagewerk.</p></section><input id="search" class="search" type="search" placeholder="Skill suchen …"><section id="app" class="accordion"></section></main><footer class="footer">Ausbildungsansicht · lokale Standards prüfen.</footer><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));let groups=[];
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const out=groups.map((g,gi)=>{const skills=(g.skills||[]).filter(s=>!q||[g.name,s.name,...(s.items||[])].join(' ').toLowerCase().includes(q));if(!skills.length)return '';return `<article class="group ${q?'open':''}"><button class="groupbtn" onclick="this.parentElement.classList.toggle('open')"><span>${esc(g.name)}</span><span>${skills.length}</span></button><div class="groupbody">${skills.map(s=>`<div class="skillitem ${q?'open':''}"><button class="skillbtn" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')"><span>${esc(s.name)}</span><span>⌄</span></button><div class="skillbody"><ul>${(s.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`).join('')}</div></article>`}).join('');document.getElementById('app').innerHTML=out||'<div class="status">Keine passenden Skills gefunden.</div>'}
document.getElementById('search').addEventListener('input',render);fetch('data/skilltraining.json').then(r=>r.json()).then(d=>{groups=d.groups||[];render()}).catch(e=>document.getElementById('app').innerHTML=`<div class="status">Daten konnten nicht geladen werden: ${esc(e.message)}</div>`);
</script></body></html>
