<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c2035"><title>ABCDE-Schema – Wissensportal</title><link rel="stylesheet" href="portal.css"></head><body data-page="abcde">
<header class="wp-topbar"><div class="wp-topinner"><button class="menu-btn" data-menu-button aria-label="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="wp-brand"><strong>ABCDE-Schema</strong><small>Wissensportal Rettungsdienst</small></div><div class="wp-head-actions"><a class="header-pill" href="./">Startseite</a></div></div></header>
<main class="portal-main"><section class="page-heading"><div class="eyebrow">Patientenbeurteilung</div><h1>ABCDE-Schema</h1><p>Wähle einen Buchstaben. Die Checkpunkte öffnen sich übersichtlich im Overlay – ideal zum schnellen Nachschlagen am Smartphone.</p></section><section id="grid" class="tile-grid abcde-grid"></section></main>
<script src="literatur/config.js"></script><script src="portal.js"></script><script>
let data;const esc=wpEsc;
function box(t,a,c=''){return a?.length?`<section class="detail-box ${c}"><h3>${esc(t)}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
function show(i){const s=data.sections[i];wpOpenOverlay(`${s.key} – ${s.title}`,'ABCDE-Schema',`<div class="detail-grid">${box('Schauen',s.look)}${box('Hören',s.listen)}${box('Messen',s.measure)}${box('Handeln',s.act)}${box('Kritisch erkennen',s.critical,'critical')}${s.remember?`<section class="detail-box remember"><h3>Merksatz</h3><p>${esc(s.remember)}</p></section>`:''}</div>`,s.subtitle)}
wpLoadContent('abcde').then(d=>{data=d;document.getElementById('grid').innerHTML=(d.sections||[]).map((s,i)=>`<button class="content-tile abcde-card" style="--tile-accent:${esc(s.color||'#0874d1')}" onclick="show(${i})"><div class="abcde-letter">${esc(s.key)}</div><h2>${esc(s.title)}</h2><p>${esc(s.subtitle||'')}</p></button>`).join('')}).catch(e=>document.getElementById('grid').innerHTML=`<p>Daten konnten nicht geladen werden: ${esc(e.message)}</p>`);
</script></body></html>
