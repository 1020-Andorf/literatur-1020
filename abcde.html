<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2f4f"><title>ABCDE-Schema</title><link rel="stylesheet" href="portal.css"></head><body data-page="abcde"><header class="page-topbar"><div class="page-topbar-inner"><button class="menu-btn" data-menu-button aria-label="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="page-brand"><strong>ABCDE-Schema</strong><small>Strukturierte Patientenbeurteilung</small></div><a class="header-link" href="index.html">Startseite</a></div></header><main class="main-wrap"><section class="section-panel"><div class="section-head"><div><h1>ABCDE-Schema</h1><p>Wähle einen Bereich. Die Inhalte öffnen sich in einem übersichtlichen Overlay mit Beurteilung, Maßnahmen und Red Flags.</p></div></div><section id="abcde-grid" class="tile-grid"></section></section></main><script src="portal-content.js"></script><script src="portal.js"></script><script>const data=wpGetContent('abcde');document.getElementById('abcde-grid').innerHTML=data.sections.map((s,i)=>`<button class="content-tile" style="--tile-accent:${wpEsc(s.accent||'#138db0')}" onclick="showSection(${i})"><span class="letter-chip">${wpEsc(s.key)}</span><h2>${wpEsc(s.title)}</h2><p>${wpEsc(s.subtitle||'')}</p></button>`).join('');function box(title,items,klass=''){return `<section class="detail-box ${klass}"><h3>${title}</h3>${items&&items.length?`<ul>${items.map(x=>`<li>${wpEsc(x)}</li>`).join('')}</ul>`:'<p>–</p>'}</section>`;}function showSection(i){const s=data.sections[i];wpOpenOverlay(`${s.key} · ${s.title}`,'ABCDE-Schema',`<div class="detail-grid">${box('Beurteilung',s.assessment)}${box('Maßnahmen',s.measures)}${box('Red Flags',s.redflags,'critical')}<section class="detail-box"><h3>Merksatz</h3><p>${wpEsc(s.remember||'')}</p></section></div>`,s.subtitle||s.intro||'');}</script></body></html>
