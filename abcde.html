<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2035"><title>ABCDE-Schema – Wissensportal</title><link rel="stylesheet" href="portal.css"></head><body><header class="topbar"><div class="topinner"><div class="brand">ABCDE-Schema<small>Wissensportal Rettungsdienst</small></div><a class="back" href="./">← Startseite</a></div></header><main class="page"><section class="hero"><h1>ABCDE-Schema</h1><p>Strukturierte Patientenbeurteilung als Nachschlagewerk.</p></section><div id="tabs" class="section-tabs"></div><div id="content"></div></main><footer class="footer">Ausbildungsansicht · lokale Standards prüfen.</footer><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));let data=null,active=0;
function list(title,items,cls=''){if(!items?.length)return '';return `<div class="listbox ${cls}"><h3>${esc(title)}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function render(){const s=data.sections[active];document.getElementById('tabs').innerHTML=data.sections.map((x,i)=>`<button class="tab ${i===active?'active':''}" onclick="active=${i};render()">${esc(x.key)} · ${esc(x.title)}</button>`).join('');document.getElementById('content').innerHTML=`<section class="panel" style="border-top:5px solid ${esc(s.color||'#0874d1')}"><h2>${esc(s.key)} – ${esc(s.title)}</h2><p class="muted">${esc(s.subtitle)}</p><div class="listcols">${list('Schauen',s.look)}${list('Hören',s.listen)}${list('Messen',s.measure)}${list('Handeln',s.act)}${list('Kritisch erkennen',s.critical,'critical')}${s.remember?`<div class="listbox remember"><h3>Merksatz</h3><p>${esc(s.remember)}</p></div>`:''}</div></section>`}
fetch('data/abcde.json').then(r=>{if(!r.ok)throw Error('Daten nicht gefunden');return r.json()}).then(d=>{data=d;render()}).catch(e=>document.getElementById('content').innerHTML=`<div class="status">ABCDE konnte nicht geladen werden: ${esc(e.message)}</div>`);
</script></body></html>
