# Beispielkonfiguration – Namen/Secrets auf deine bestehende Worker-Installation anpassen.
name = "ost1020-api"
main = "worker.js"
compatibility_date = "2026-10-01"

# Täglich 03:00 UTC. Backups laufen nur, wenn BACKUPS als R2-Binding existiert.
[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "ost1020-backups"

[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "ERSETZE_DURCH_DEINE_KV_NAMESPACE_ID"

[vars]
GITHUB_OWNER = "DEIN_GITHUB_NUTZER"
GITHUB_REPO = "DEIN_REPOSITORY"
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "https://DEINE_DOMAIN"
PUBLIC_BASE_URL = "https://DEINE_DOMAIN"

# Secrets getrennt über Wrangler / Cloudflare Dashboard hinterlegen:
# GITHUB_TOKEN
# ADMIN_PIN_SHA256
# FEEDBACK_SALT
